name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: core
        run: cargo test --locked

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build core and app
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path core/Cargo.toml
          flutter config --enable-windows-desktop
          Set-Location app
          flutter pub get
          flutter build windows --release
          Set-Location ..
          Copy-Item core\target\release\rsq_core.dll app\build\windows\x64\runner\Release\rsq_core.dll -Force
      - name: Pack browser
        shell: pwsh
        run: |
          $root = "dist\browser-pack"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Path "$root\extension" | Out-Null
          Copy-Item extension\manifest.json,extension\background.js,extension\popup.html,extension\popup.css,extension\popup.js,extension\proxy_rules.js,extension\icon16.png,extension\icon48.png,extension\icon128.png "$root\extension\"
          Copy-Item core\target\release\tiaotiaohou-browser.exe "$root\tiaotiaohou-browser.exe"
          Copy-Item "browser\启动.bat" "$root\启动.bat"
          $exe = Get-Item "$root\tiaotiaohou-browser.exe"
          if ($exe.Length -lt 1000000) { throw "核心文件不完整: $($exe.Length)" }
          if (Test-Path dist\tiaotiaohou-browser.zip) { Remove-Item dist\tiaotiaohou-browser.zip }
          Compress-Archive -Path "$root\*" -DestinationPath dist\tiaotiaohou-browser.zip
          $zip = Get-Item dist\tiaotiaohou-browser.zip
          if ($zip.Length -lt 1000000) { throw "压缩包不完整: $($zip.Length)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipFile = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist\tiaotiaohou-browser.zip))
          try {
            $names = @($zipFile.Entries | ForEach-Object { $_.FullName })
          } finally {
            $zipFile.Dispose()
          }
          if ($names -notcontains "tiaotiaohou-browser.exe") { throw "压缩包里没有核心" }
          if ($names -notcontains "extension/manifest.json" -and $names -notcontains "extension\manifest.json") { throw "压缩包里没有扩展" }
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-browser
          path: dist/tiaotiaohou-browser.zip
          if-no-files-found: error
      - name: Publish browser
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view windows --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          }
          gh release upload windows dist/tiaotiaohou-browser.zip --repo ${{ github.repository }} --clobber
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          & $iscc tool\crush-vpn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\tiaotiaohou-Setup.exe)) { throw "没有生成安装包" }
          Get-Item dist\tiaotiaohou-Setup.exe | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-setup
          path: dist/tiaotiaohou-Setup.exe
          if-no-files-found: error
      - name: Publish installer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view windows --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip 后打开。"
          }
          gh release upload windows dist/tiaotiaohou-Setup.exe --repo ${{ github.repository }} --clobber

  macos:
    name: macOS 应用
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build core and app
        run: sh tool/build-macos.sh
      - name: Zip app
        run: |
          mkdir -p dist
          cd app/build/macos/Build/Products/Release
          rm -rf "跳跳猴.app"
          cp -R rsq.app "跳跳猴.app"
          ditto -c -k --keepParent "跳跳猴.app" "$GITHUB_WORKSPACE/dist/tiaotiaohou-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-macos
          path: dist/tiaotiaohou-macos.zip
          if-no-files-found: error
      - name: Publish app
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view windows --repo ${{ github.repository }} || gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          gh release upload windows dist/tiaotiaohou-macos.zip --repo ${{ github.repository }} --clobber

  linux:
    name: Linux 安装包
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build and package
        run: sh tool/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-linux
          path: |
            dist/tiaotiaohou-linux-amd64.deb
            dist/tiaotiaohou-linux-x64.tar.gz
          if-no-files-found: error
      - name: Publish packages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view windows --repo ${{ github.repository }} || gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          gh release edit windows --repo ${{ github.repository }} --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          gh release upload windows dist/tiaotiaohou-linux-amd64.deb dist/tiaotiaohou-linux-x64.tar.gz --repo ${{ github.repository }} --clobber

  android:
    name: Android 安装包
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build native core
        working-directory: core
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/android/app/src/main/jniLibs build --release
      - name: Build apk
        working-directory: app
        run: |
          flutter config --enable-android
          flutter pub get
          flutter build apk --release
      - name: Collect apk
        run: |
          mkdir -p dist
          apk=$(find . -path '*flutter-apk/app-release.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "没有找到 apk"
            exit 1
          fi
          cp "$apk" dist/tiaotiaohou.apk
          ls -lh dist/tiaotiaohou.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-android
          path: dist/tiaotiaohou.apk
          if-no-files-found: error
      - name: Publish apk
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view windows --repo ${{ github.repository }} || gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          gh release edit windows --repo ${{ github.repository }} --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip。Linux 安装 tiaotiaohou-linux-amd64.deb，或解压 tiaotiaohou-linux-x64.tar.gz。Android 安装 tiaotiaohou.apk，在应用里填 127.0.0.1:1080。浏览器解压 tiaotiaohou-browser.zip，双击启动.bat，再用 Chrome 或 Edge 加载 extension 文件夹，填好节点后开始连接。"
          gh release upload windows dist/tiaotiaohou.apk --repo ${{ github.repository }} --clobber

  browser:
    name: 浏览器扩展
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test proxy rules
        run: node --test extension/proxy_rules.test.js
