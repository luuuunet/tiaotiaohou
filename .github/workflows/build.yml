name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: core
        run: cargo test --locked

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build core and app
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path core/Cargo.toml
          flutter config --enable-windows-desktop
          Set-Location app
          flutter pub get
          flutter build windows --release
          Set-Location ..
          Copy-Item core\target\release\rsq_core.dll app\build\windows\x64\runner\Release\rsq_core.dll -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          & $iscc tool\crush-vpn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\tiaotiaohou-Setup.exe)) { throw "没有生成安装包" }
          Get-Item dist\tiaotiaohou-Setup.exe | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-setup
          path: dist/tiaotiaohou-Setup.exe
          if-no-files-found: error
      - name: Publish installer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view windows --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip 后打开。"
          }
          gh release upload windows dist/tiaotiaohou-Setup.exe --repo ${{ github.repository }} --clobber

  macos:
    name: macOS 应用
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Build core and app
        run: sh tool/build-macos.sh
      - name: Zip app
        run: |
          mkdir -p dist
          cd app/build/macos/Build/Products/Release
          rm -rf "跳跳猴.app"
          cp -R rsq.app "跳跳猴.app"
          ditto -c -k --keepParent "跳跳猴.app" "$GITHUB_WORKSPACE/dist/tiaotiaohou-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tiaotiaohou-macos
          path: dist/tiaotiaohou-macos.zip
          if-no-files-found: error
      - name: Publish app
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view windows --repo ${{ github.repository }} || gh release create windows --repo ${{ github.repository }} --title "跳跳猴" --notes "Windows 双击 tiaotiaohou-Setup.exe。macOS 解压 tiaotiaohou-macos.zip 后打开。"
          gh release upload windows dist/tiaotiaohou-macos.zip --repo ${{ github.repository }} --clobber
